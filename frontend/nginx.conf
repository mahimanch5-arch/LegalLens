# nginx configuration for LegalLens React SPA
# Serves static files from /usr/share/nginx/html
# Routes all non-file requests to index.html (SPA routing)
# Proxies /api calls to backend if BACKEND_URL is set

# Upstream backend: resolved by container name on the shared Docker network
upstream backend {
    server backend:8000;
}

server {
    # Listen on port 3000 (matches development environment)
    listen 3000 default_server;
    listen [::]:3000 default_server;

    # Server name (localhost for local testing, * for any in production)
    server_name _;

    # Disable nginx version in Server header (security: hide software version)
    server_tokens off;

    # Root directory where built React app files are located
    root /usr/share/nginx/html;

    # Index file to serve when requesting a directory
    index index.html;

    # === GZIP COMPRESSION ===
    # Compress responses for smaller transfer size (faster loading)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    # === CACHING HEADERS ===
    # Cache busting: files with content hashes in their names (from Vite build)
    # are cached indefinitely. Files without hashes are not cached.
    location ~* "\.[0-9a-f]{8}\.(js|css)$" {
        # Vite bundles include content hash: main.abc12345.js
        # Safe to cache forever since filename changes when content changes
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg)$ {
        # Static assets can be cached for a long time
        expires 1y;
        add_header Cache-Control "public";
    }

    # Don't cache index.html (always get latest version)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # === API PROXY ===
    # Forward /api/* requests to backend server
    # Allows frontend to call /api/ask without CORS issues
    location /api/ {
        # Proxy to backend (default localhost:8000)
        # Can be overridden with BACKEND_URL environment variable
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Pass original headers (Important for cookies, auth, etc.)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if backend uses SSE or WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running requests (like LLM generation)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;  # Allow up to 2 minutes for API calls

        # Buffering: allow large responses from backend
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # === SPA ROUTING ===
    # For React Router: all non-file requests go to index.html
    # This lets React Router handle routing on the frontend
    location / {
        # Try to serve the requested file
        # If file doesn't exist, try index.html (SPA fallback)
        try_files $uri $uri/ /index.html;
    }

    # === ERROR PAGES ===
    # Serve index.html for 404 errors (SPA will handle routing)
    error_page 404 /index.html;

    # Custom error pages for server errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;  # Only accessible internally
    }

    # === SECURITY HEADERS ===
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Content Security Policy (strict for static SPA)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; connect-src 'self' /api/;" always;

    # === DENY ACCESS ===
    # Hide sensitive files and directories
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }
}
